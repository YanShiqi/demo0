{% extends "base.html" %}
{% block title %}修改临时密码 · 牢笼{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">PASSWORD REQUIRED</p>
  <h1>必须修改密码</h1>
  <p class="muted">管理员已为你重置临时密码。继续使用网站前，请设置一个新的正式密码。</p>
  {% if has_error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form action="/password/change-required" method="post">
    <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}">
    <label>新密码<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" oncopy="return false" oncut="return false" required><small>12～128 个字符，不能继续使用用户名</small></label>
    <label>确认新密码<input type="password" name="password_confirmation" minlength="12" maxlength="128" autocomplete="new-password" oncopy="return false" oncut="return false" required><small>请再次输入相同密码</small></label>
    <button class="button full" type="submit">保存新密码</button>
  </form>
</section>
{% endblock %}
