# 商城商品目录；默认保持为空，新增商品前请先将图标放入配置的图标目录。
# 每个商品都必须使用唯一的小写 ID，图标必须是与扩展名匹配的 PNG、JPEG 或 WebP。

# [[products]]
# # 稳定的商品标识；仅允许小写字母、数字、下划线和连字符。
# id = "one-month-token"
# # 面向用户展示的商品名称。
# name = "一个月兑换码"
# # 面向用户展示的商品说明。
# description = "兑换后获得一个有效期为 30 天的兑换码。"
# # 图标目录中的单个文件名；不能包含路径。
# icon_file = "one-month-token.png"
# # 兑换此商品所需的整数洲币数量。
# price = 100
# # 可选的兑换码有效天数；省略表示不设置有效期。
# valid_days = 30
# # 单个用户同时持有的此商品有效兑换码上限。
# max_active_per_user = 1
# # 是否在商城中向用户展示。
# enabled = true
# # 商品排序值；数值越小越靠前，相同值按 ID 排序。
# sort_order = 10
