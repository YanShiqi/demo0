[server]
# 网站监听地址；本机开发通常用 127.0.0.1，WSL 端口转发场景可改为 0.0.0.0。
host = "127.0.0.1"
# 网站监听端口；Windows 端口转发已使用 6324。
port = 6324

[database]
# SQLite 数据库地址；mode=rwc 表示不存在时创建并允许读写。
url = "sqlite://data/app.db?mode=rwc"

[avatar]
# 用户上传头像的存储目录；目录内容属于运行数据，不提交到 Git。
dir = "data/avatars"

[session]
# HTTPS 部署时应设为 true，本地 HTTP 开发保持 false。
cookie_secure = false

[display]
# 页面展示时间使用的 UTC 小时偏移；中国时间为 8。
utc_offset_hours = 8

[messages]
# 公共留言保留天数；展示、发言限制和自动清理都会使用这个窗口。
retention_days = 5
# 每个用户在保留窗口内最多可发布的留言数量。
limit_per_user = 5
# 单条留言最大可见字符数；支持中文、换行和 emoji。
max_length = 300
# 公共留言板页面最多展示的留言数量。
page_size = 30
# 首页公共留言预览最多展示的留言数量。
home_preview_limit = 5
# 后台自动清理过期留言的间隔小时数。
cleanup_interval_hours = 6

[memes]
# Meme 图片和 GIF 的存储目录；目录内容属于运行数据，不提交到 Git。
dir = "data/memes"
# 单个 Meme 上传最大体积；第一版使用 3 MiB，避免 GIF 过大拖慢页面。
max_upload_bytes = 3145728
# Meme 图片允许的最大宽高；超过后会拒绝上传。
max_dimension = 3000
# GIF 允许的最大帧数；过高会增加解码和浏览器播放压力。
max_gif_frames = 120
# GIF 解码后的最大总像素数；用于拦截小体积但解码很重的动图。
max_decoded_pixels = 50000000
# Meme 展示墙每页最多返回数量；前端通过页码前后翻页。
page_size = 20
# 个人资料页的 Meme 管理列表每页最多展示数量；避免一次性加载全部图片。
profile_page_size = 12
# 首页 Meme 预览最多展示数量。
home_preview_limit = 8
# Meme 展示墙最多展示的热门标签数量。
popular_tag_limit = 10
# 每个 Meme 最多可绑定的标签数量。
max_tags_per_meme = 5
# 单个标签最大可见字符数；支持中文和 emoji。
max_tag_length = 20
# Meme 标题最大可见字符数。
max_title_length = 60
# Meme 首次审核通过时是否发放货币奖励。
approval_reward_enabled = true
# 每个 Meme 首次通过时发放的整数货币数量。
approval_reward_amount = 2

[novels]
# 首页小说页签最多展示的最近更新章节数量。
home_preview_limit = 5
# 单章 Markdown 最大上传体积，单位字节。
chapter_max_upload_bytes = 262144
# 小说标题最大可见字符数。
max_title_length = 60
# 章节标题最大可见字符数。
max_chapter_title_length = 80
# 单条章节匿名评论最大可见字符数；支持中文、换行和 emoji。
chapter_comment_max_length = 300
# 单个章节页面默认展示的评论数量。
chapter_comment_page_size = 50

[updates]
# 服务器更新记录文件路径；发布新版本时编辑这个文件并重新启动服务。
file = "content/updates.toml"
# 首页独立更新记录区域最多展示的最近条目数。
home_preview_limit = 3

[currency]
# 页面展示的货币名称；业务逻辑使用稳定的金额字段，不依赖这个文字。
name = "洲币"
# 页面展示的货币符号；可替换为项目喜欢的 emoji 或文字符号。
symbol = "🪙"
# 货币流水页每页最多展示的记录数量。
log_page_size = 30
# 货币管理页展示所有用户最近流水的数量。
admin_recent_log_limit = 10
# 超级管理员单次增减货币的最大绝对值。
max_admin_adjust_amount = 99999
# 管理员搜索用户时最多返回的用户数量。
admin_user_search_limit = 20
# 管理员调整货币时备注的最大字符数。
max_note_length = 200

[check_in]
# 是否开启每周签到功能；关闭后首页不展示入口，签到端点也不接受请求。
enabled = true
# 每周签到成功后发放的整数货币数量。
reward_amount = 1

[shop]
# 是否开启商城；关闭后后续功能不应向普通用户展示兑换入口。
enabled = true
# 旧商品目录 TOML 的路径；数据库商品读取接入前的临时兼容配置。
products_file = "content/shop.toml"
# 数据库商品图标的运行数据目录；目录内容不提交 Git。
icon_dir = "data/shop/product-icons"
# 商城商品列表每页展示数量。
page_size = 12
# 用户兑换券列表每页展示数量。
voucher_page_size = 20
# 管理员备注允许的最大可见字符数。
admin_note_max_length = 200
# 单个来源在兑换码查询窗口内允许的最大尝试次数。
token_lookup_max_attempts = 20
# 兑换码查询限流窗口，单位为秒。
token_lookup_window_seconds = 60
# 管理端单次图标原始上传最大体积，单位为字节；自动压缩前仍会先执行该限制。
icon_upload_max_bytes = 5242880
# 管理端图标原始图片允许的最大宽度或高度，单位为像素。
icon_input_max_dimension = 4096
# 管理端 GIF 图标允许的最大帧数；过高会增加处理和播放压力。
icon_max_gif_frames = 120
# 管理端 GIF 图标解码后的最大总像素数；用于拦截小体积但解码很重的动图。
icon_max_decoded_pixels = 80000000
# 自动处理后图标的最大存储体积，单位为字节；超限会继续尝试更小尺寸。
icon_max_stored_bytes = 1048576
# 图标压缩时依次尝试的最大边长，必须严格降序且至少保留一个候选值。
icon_resize_dimensions = [512, 384, 256]
# 旧商品目录图标文件最大体积，单位为字节；数据库商品读取接入前的临时兼容配置。
icon_max_bytes = 262144
# 旧商品目录图标允许的最大宽度或高度，单位为像素；数据库商品读取接入前的临时兼容配置。
icon_max_dimension = 1024
