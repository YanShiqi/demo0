[server]
# 网站监听地址；本机开发通常用 127.0.0.1，WSL 端口转发场景可改为 0.0.0.0。
host = "127.0.0.1"
# 网站监听端口；Windows 端口转发已使用 6324。
port = 6324

[database]
# SQLite 数据库地址；mode=rwc 表示不存在时创建并允许读写。
url = "sqlite://data/app.db?mode=rwc"

[avatar]
# 用户上传头像的存储目录；目录内容属于运行数据，不提交到 Git。
dir = "data/avatars"

[session]
# HTTPS 部署时应设为 true，本地 HTTP 开发保持 false。
cookie_secure = false

[display]
# 页面展示时间使用的 UTC 小时偏移；中国时间为 8。
utc_offset_hours = 8

[messages]
# 公共留言保留天数；展示、发言限制和自动清理都会使用这个窗口。
retention_days = 5
# 每个用户在保留窗口内最多可发布的留言数量。
limit_per_user = 5
# 单条留言最大可见字符数；支持中文、换行和 emoji。
max_length = 300
# 公共留言板页面最多展示的留言数量。
page_size = 30
# 首页公共留言预览最多展示的留言数量。
home_preview_limit = 5
# 后台自动清理过期留言的间隔小时数。
cleanup_interval_hours = 6

[memes]
# Meme 图片和 GIF 的存储目录；目录内容属于运行数据，不提交到 Git。
dir = "data/memes"
# 单个 Meme 上传最大体积；第一版使用 5 MiB，避免 GIF 过大拖慢页面。
max_upload_bytes = 5242880
# Meme 图片允许的最大宽高；超过后会拒绝上传。
max_dimension = 3000
# GIF 允许的最大帧数；过高会增加解码和浏览器播放压力。
max_gif_frames = 120
# Meme 展示墙每页最多返回数量；前端通过加载更多继续翻页。
page_size = 20
# 首页 Meme 预览最多展示数量。
home_preview_limit = 6
# 每个 Meme 最多可绑定的标签数量。
max_tags_per_meme = 5
# 单个标签最大可见字符数；支持中文和 emoji。
max_tag_length = 20
# Meme 标题最大可见字符数。
max_title_length = 60
